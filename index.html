<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TON Task Rewards</title>
  <!-- Telegram Web App SDK oficial -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .user-info {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 24px;
      text-align: center;
    }

    .balance-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .balance-label {
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .balance-value {
      font-size: 42px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }

    .balance-subtext {
      font-size: 12px;
      color: var(--text-dim);
    }

    .tasks-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
    }

    .task-reward {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    .btn-action {
      background: var(--accent);
      color: #0f172a;
      border: none;
      outline: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-action:active {
      opacity: 0.8;
    }

    .btn-action.completed {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: not-allowed;
    }

    .withdraw-container {
      width: 100%;
      max-width: 400px;
      margin-top: auto;
    }

    .btn-withdraw {
      width: 100%;
      background: var(--success);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-withdraw:active {
      opacity: 0.85;
    }

    .footer {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="user-info" id="user-display">A carregar perfil...</div>

  <div class="balance-card">
    <div class="balance-label">Saldo Disponível</div>
    <div class="balance-value" id="balance-points">0</div>
    <div class="balance-subtext">Pontos (Meta: 1000 = Retirada TON)</div>
  </div>

  <div class="tasks-container">
    <!-- Tarefa 1 -->
    <div class="task-card">
      <div class="task-details">
        <span class="task-title">Conhecer a Rede TON</span>
        <span class="task-reward">+50 Pontos</span>
      </div>
      <button class="btn-action" id="btn-task-1" onclick="handleTask(1, 50, 'https://ton.org')">Visitar</button>
    </div>

    <!-- Tarefa 2 -->
    <div class="task-card">
      <div class="task-details">
        <span class="task-title">Entrar no Canal Oficial</span>
        <span class="task-reward">+100 Pontos</span>
      </div>
      <button class="btn-action" id="btn-task-2" onclick="handleTask(2, 100, 'https://t.me/telegram')">Entrar</button>
    </div>

    <!-- Tarefa 3 -->
    <div class="task-card">
      <div class="task-details">
        <span class="task-title">Explorador TON Scan</span>
        <span class="task-reward">+30 Pontos</span>
      </div>
      <button class="btn-action" id="btn-task-3" onclick="handleTask(3, 30, 'https://tonscan.org')">Verificar</button>
    </div>
  </div>

  <div class="withdraw-container">
    <button class="btn-withdraw" onclick="handleWithdraw()">Solicitar Retirada</button>
  </div>

  <div class="footer">@Zindoprofx_bot</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Identificação do utilizador
    const user = tg.initDataUnsafe?.user;
    const userDisplay = document.getElementById('user-display');
    if (user) {
      userDisplay.textContent = `ID: ${user.id} | @${user.username || user.first_name}`;
    } else {
      userDisplay.textContent = "Ambiente de Teste Local";
    }

    // Gestão de saldo e tarefas
    let balance = parseInt(localStorage.getItem('user_balance') || '0', 10);
    document.getElementById('balance-points').textContent = balance;

    const completedTasks = JSON.parse(localStorage.getItem('completed_tasks') || '[]');
    completedTasks.forEach(taskId => {
      const btn = document.getElementById(`btn-task-${taskId}`);
      if (btn) {
        btn.textContent = "Concluído";
        btn.classList.add("completed");
        btn.disabled = true;
      }
    });

    function handleTask(taskId, points, url) {
      if (completedTasks.includes(taskId)) return;

      // Abrir o link através da API do Telegram ou navegador
      if (tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }

      // Atribuir recompensa
      balance += points;
      completedTasks.push(taskId);

      localStorage.setItem('user_balance', balance.toString());
      localStorage.setItem('completed_tasks', JSON.stringify(completedTasks));

      document.getElementById('balance-points').textContent = balance;
      const btn = document.getElementById(`btn-task-${taskId}`);
      if (btn) {
        btn.textContent = "Concluído";
        btn.classList.add("completed");
        btn.disabled = true;
      }
    }

    function handleWithdraw() {
      if (balance >= 1000) {
        tg.showAlert("Parabéns! O seu pedido de levantamento de TON foi enviado para análise da equipa.");
      } else {
        tg.showAlert(`Você precisa de pelo menos 1000 pontos. Saldo atual: ${balance}`);
      }
    }
  </script>
</body>
</html>
